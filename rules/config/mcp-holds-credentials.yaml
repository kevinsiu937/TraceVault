# An MCP server is handed credentials through its environment or headers.
# Every agent may call every MCP tool unless the configuration says otherwise,
# so a token given to one server is in reach of all of them. Values are never
# stored; the names under environment and headers are, and this matches them.
id: mcp-holds-credentials
version: 1
severity: medium
title: An add-on tool holds your passwords or keys
explanation: "This add-on is given passwords or keys, and every agent can use its tools unless the settings say otherwise."
recommendation: "Give the add-on only the access it needs, and only to the agents that use it. (For the developer: give the MCP server the narrowest token, and allow its tools only where needed.)"
source:
  kind: owasp-mcp
  id: "MCP01:2025"
  title: "Token Mismanagement & Secret Exposure"
subject: mcp-server
when:
  - match:
      secret_keys: { regex: "key|token|secret|password|auth|credential" }
