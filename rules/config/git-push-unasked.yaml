# An agent can push to a remote repository without being asked. A secret it
# read or wrote can then reach GitHub before anyone looks; Phase 2's
# exfiltration-chain flags it afterwards, this rule shows beforehand that it
# could. Only an allowance the configuration writes counts: OpenCode's default
# allows every command, and shell-unrestricted already reports that.
id: git-push-unasked
version: 1
severity: medium
title: Can publish code online without asking
explanation: "The agent can publish code to an online repository without asking, so a password it has read could be published before anyone checks."
recommendation: "Make the agent ask before it publishes code, so a person reviews it first. (For the developer: set bash for git push to ask.)"
source:
  kind: owasp-agentic
  id: ASI02
  title: Tool Misuse and Exploitation
subject: agent
when:
  - allows:
      permission: bash
      target: ["git push", "git push origin main", "git push --force origin main"]
      configured: true
