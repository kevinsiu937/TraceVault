# An agent can run arbitrary code through the shell without being asked.
# Each target is a command only an open shell allows: deleting everything, or
# running code passed on the command line. An allow-list of commands such as
# `ls *` or `git status` stays silent. OpenCode's default allows every command.
id: shell-unrestricted
version: 1
severity: high
title: Can run any command without asking
explanation: "The agent can run commands on the computer without asking, including commands that delete files or start other programs."
recommendation: "Make the agent ask before it runs commands on the computer. (For the developer: set bash to ask, and allow only the commands this agent needs.)"
source:
  kind: owasp-agentic
  id: ASI05
  title: Unexpected Code Execution
subject: agent
when:
  - allows:
      permission: bash
      target: ["rm -rf /", "python3 -c 'print(1)'", "sh -c id"]
