# A local MCP tool's text holds characters a person does not see but the
# model reads: zero-width characters, bidirectional controls, and the
# Unicode tag block, which can spell out a whole hidden sentence.
id: tool-invisible-text
version: 1
severity: high
title: An add-on tool contains invisible text
explanation: "This add-on's tool may be poisoned. Its description, which the AI reads, contains characters that do not show on screen."
recommendation: "Stop using this add-on and have someone check its text for hidden characters. (For the developer: disable the MCP server and inspect the description.)"
source:
  kind: owasp-mcp
  id: "MCP03:2025"
  title: Tool Poisoning
subject: tool
when:
  - match: { text: { regex: '[​-‏‪-‮⁠-⁤﻿\u{E0000}-\u{E007F}]+' } }
