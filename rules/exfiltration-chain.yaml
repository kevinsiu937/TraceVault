# A sensitive file is read, then something that can carry data off the machine
# runs. Shell egress is matched by command text, which is easy to evade, so the
# finding says "possible" and names the pattern that matched, nothing more.
#
# Every egress inside the window is its own finding, so a harmless MCP call
# does not hide a later curl. A denied egress never ran and is not one. When
# several sensitive reads are open, a finding names the earliest still inside
# the window.
id: exfiltration-chain
version: 1
severity: high
title: Read a secret, then sent data out
explanation: "The agent read a file holding passwords or keys, then did something that can send data off the computer. The secret may have left the computer, so check what was sent."
recommendation: "Find out what was sent and where. If a password or key may have left the computer, change it now. (For the developer: check the egress call, and rotate the secret.)"
window: { seconds: 1800 }
steps:
  - any:
      - label: sensitive read
        match:
          type: { equals: document.access }
          operation: { equals: read }
          path: { glob: { list: sensitive-paths } }
      - label: sensitive file named in the shell
        match:
          type: { equals: hook.script }
          tool: { equals: bash }
          target: { names: { list: sensitive-paths } }
          outcome: { in: [ok, error, timeout] }
  - each: true
    any:
      - label: webfetch
        match:
          type: { equals: hook.script }
          tool: { equals: webfetch }
          outcome: { in: [ok, error, timeout] }
      - label: shell egress
        match:
          type: { equals: hook.script }
          tool: { equals: bash }
          target: { regex: '\b(curl|wget|nc|ncat|netcat|scp|sftp|rsync|ftp|Invoke-WebRequest|Invoke-RestMethod|iwr|irm)\b' }
          outcome: { in: [ok, error, timeout] }
      - label: git push
        match:
          type: { equals: hook.script }
          tool: { equals: bash }
          target: { regex: '(^|[;&|]\s*)git\s+(-C\s+\S+\s+)?push\b' }
          outcome: { in: [ok, error, timeout] }
      - label: MCP call
        match:
          type: { equals: mcp.call }
          outcome: { in: [ok, error, timeout] }
