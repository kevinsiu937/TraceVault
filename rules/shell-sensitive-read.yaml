id: shell-sensitive-read
version: 1
severity: low
title: Named a password or key file in a command
explanation: "A command the agent ran named a file that holds passwords or keys, for example to show it on screen. TraceVault reads the words of the command, so the command may not really have opened the file."
recommendation: "Check whether the command really opened the file and where its output went. (For the developer: set bash to ask for commands that name secret files.)"
steps:
  - match:
      type: { equals: hook.script }
      tool: { equals: bash }
      target: { names: { list: sensitive-paths } }
