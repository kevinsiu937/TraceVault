# The agent keeps trying calls it was refused. One denial is normal; several in
# a few minutes can mean it is searching for a way around its permissions.
# Only the stored `denied` outcome counts: a plain error is not a refusal.
id: probing
version: 1
severity: medium
title: Kept trying things it was refused
explanation: "The agent kept trying actions it had been refused. This can mean it was looking for a way around its limits."
recommendation: "Look at what the agent kept trying to do. Stop it if it was trying to get around its limits. (For the developer: read the refused calls in the timeline.)"
window: { seconds: 300 }
steps:
  - repeat: 3
    match:
      outcome: { equals: denied }
