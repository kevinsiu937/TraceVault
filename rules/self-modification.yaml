# The agent edits its own configuration or standing instructions.
# opencode.json and .opencode/ hold its permissions, tools and agents;
# AGENTS.md steers every future session. Reads are fine; writes are the risk.
id: self-modification
version: 1
severity: high
explanation: The agent changed its own configuration or standing instructions, which can widen what it is allowed to do.
steps:
  - match:
      type: { equals: document.access }
      operation: { in: [write, delete, rename] }
      path:
        glob:
          - "**/opencode.json"
          - "**/opencode.jsonc"
          - "**/.opencode/**"
          - "**/AGENTS.md"
          - "**/.config/opencode/**"
