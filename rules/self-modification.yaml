# The agent edits its own configuration or standing instructions.
# opencode.json and .opencode/ hold its permissions, tools and agents;
# AGENTS.md steers every future session. Reads are fine; writes are the risk.
# Blockable: with `init --block`, such a write is refused before it runs.
id: self-modification
version: 1
severity: high
title: Changed its own settings or instructions
explanation: "The agent changed its own configuration, the settings or standing instructions that decide what it may do. This can give it more freedom than intended."
recommendation: "Review the change to the agent's settings or instructions, and undo it if nobody asked for it. (For the developer: revert the change, and set edit to ask for these files.)"
blockable: true
steps:
  - match:
      type: { equals: document.access }
      operation: { in: [write, delete, rename] }
      path:
        glob:
          - "**/opencode.json"
          - "**/opencode.jsonc"
          - "**/.opencode/**"
          - "**/AGENTS.md"
          - "**/.config/opencode/**"
