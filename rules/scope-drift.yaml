# The agent touches files outside the folder its session works in. The first
# step remembers that folder from the session start; every later access outside
# it is its own finding. A session whose folder is unknown (recorded before
# Phase 2, or started before TraceVault was installed) stays silent.
id: scope-drift
version: 1
severity: medium
title: Opened a file outside its project folder
explanation: "The agent opened a file outside the folder of the project it was working on."
recommendation: "Check why the agent needed a file outside its project. Keep it inside its folder if it did not. (For the developer: set external_directory to ask or deny.)"
window: session
steps:
  - match:
      type: { equals: session.start }
    bind: { project: root }
  - each: true
    match:
      type: { equals: document.access }
      path: { outside: root }
