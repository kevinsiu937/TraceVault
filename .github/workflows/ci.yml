name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 is a hard floor: the code imports node:sqlite.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # OpenCode 1.18.32 runs the plugin on Bun 1.3.14 (ticket 65 probe); the suites above run it on Node only.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun tests/bun/plugin-smoke.mjs
      # Packs, installs the tarball into a temporary prefix, and runs the installed CLI.
      - run: node tests/package/install-smoke.mjs
